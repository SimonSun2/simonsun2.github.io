<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到 | Apex Racing</title>
    <meta name="description" content="抱歉，您访问的页面不存在。返回Apex Racing首页或浏览我们的精彩内容。">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=3">
    
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 24px 80px;
            background: linear-gradient(to bottom, rgba(10,10,10,0.9), rgba(10,10,10,1));
        }
        
        .error-code {
            font-family: var(--font-mono);
            font-size: clamp(100px, 20vw, 200px);
            font-weight: 800;
            color: var(--color-accent-gold);
            line-height: 1;
            margin-bottom: 20px;
            text-shadow: 0 0 40px rgba(212, 175, 55, 0.3);
        }
        
        .error-title {
            font-size: clamp(24px, 4vw, 36px);
            font-weight: 700;
            margin-bottom: 16px;
        }
        
        .error-message {
            font-size: 18px;
            color: var(--color-text-secondary);
            max-width: 500px;
            margin: 0 auto 40px;
            line-height: 1.7;
        }
        
        .error-actions {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .error-illustration {
            font-size: 80px;
            color: var(--color-accent-gold);
            margin-bottom: 30px;
            opacity: 0.8;
        }
        
        .suggested-links {
            margin-top: 60px;
            padding-top: 40px;
            border-top: 1px solid var(--color-border);
        }
        
        .suggested-links h3 {
            font-size: 16px;
            color: var(--color-text-secondary);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .suggested-links ul {
            list-style: none;
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .suggested-links a {
            color: var(--color-text-primary);
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .suggested-links a:hover {
            color: var(--color-accent-gold);
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <div class="logo-icon">
                    <i class="fas fa-flag-checkered"></i>
                </div>
                <div class="logo-text">APEX <span>RACING</span></div>
            </a>
            
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="about.html">关于我们</a></li>
                <li><a href="team.html">核心成员</a></li>
                <li><a href="cars/">赛车展示</a></li>
                <li><a href="join.html">加入我们</a></li>
            </ul>
            
            <button class="mobile-menu-btn">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>
    
    <!-- 错误页面内容 -->
    <main class="error-page">
        <div class="container">
            <div class="error-illustration">
                <i class="fas fa-car-crash"></i>
            </div>
            
            <div class="error-code">404</div>
            
            <h1 class="error-title">页面未找到</h1>
            
            <p class="error-message">
                抱歉，您访问的页面似乎偏离了赛道。<br>
                它可能已经被移除、更名，或者从未存在过。
            </p>
            
            <div class="error-actions">
                <a href="index.html" class="btn btn-gold btn-large">
                    <i class="fas fa-home"></i>
                    返回首页
                </a>
                <a href="javascript:history.back()" class="btn btn-outline btn-large">
                    <i class="fas fa-arrow-left"></i>
                    返回上一页
                </a>
            </div>
            
            <div class="suggested-links">
                <h3>或者浏览以下页面</h3>
                <ul>
                    <li><a href="about.html"><i class="fas fa-info-circle"></i> 关于我们</a></li>
                    <li><a href="team.html"><i class="fas fa-users"></i> 核心成员</a></li>
                    <li><a href="cars/"><i class="fas fa-car"></i> 赛车展示</a></li>
                    <li><a href="join.html"><i class="fas fa-user-plus"></i> 加入我们</a></li>
                    <li><a href="contact.html"><i class="fas fa-envelope"></i> 联系我们</a></li>
                </ul>
            </div>
        </div>
    </main>
    
    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Apex Racing. 保留所有权利。
                </p>
            </div>
        </div>
    </footer>
    
    <script src="js/main.js?v=3"></script>
</body>
</html>
